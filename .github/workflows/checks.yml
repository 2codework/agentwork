name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Checked-in checkpoint file-set and hashes (not QA attestation)
        run: python scripts/check_checkpoint.py .
      - name: Build and validate content schema
        run: python scripts/build.py
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and regression tests
        run: |
          find web tests -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --test tests/*.test.js
      - name: Original offline MCP contract (not SDK compatibility)
        run: |
          python learning/mcp/raw/validate.py
          python -m unittest discover -s learning/mcp/raw/tests -v
      - name: Pages parity, JSON and local links
        run: python scripts/check_pages.py
      - name: Generated files must be committed and current
        run: |
          git diff --exit-code -- BOOK.md site/ docs/
          test -z "$(git ls-files --others --exclude-standard -- BOOK.md site/ docs/)"
      - name: Final checkpoint file-set and hashes (not QA attestation)
        run: python scripts/check_checkpoint.py .
