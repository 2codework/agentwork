<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预约演示</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;color:#14213d;background:#fff;font:18px system-ui}.card{max-width:360px;border:1px solid #14213d;border-radius:12px;padding:16px}button{background:#005fcc;color:white;padding:12px;border:0;border-radius:12px}button:focus-visible{outline:3px solid #14213d;outline-offset:3px}</style><main class="card"><h1>周末陶艺</h1><p>180元</p><p>本地演示，不会下单</p><button id="book">预约</button><p id="state" role="status"></p></main><script>document.querySelector("#book").onclick=function(){this.disabled=true;document.querySelector("#state").textContent="已预约（演示）"}</script></html>
